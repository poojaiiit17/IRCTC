<!DOCTYPE html>
<html>
<head>
    <title>Book Ticket</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><h1>Book Ticket</h1></header>
<div class="card">
    <input id="passengerName" placeholder="Passenger Name">
    <input id="passengerAge" type="number" placeholder="Age">
    <input id="passengerGender" placeholder="Gender">
    <input id="journeyDate" type="date">
    <input id="amount" type="number" placeholder="Amount">
    <button onclick="bookTicket()">Confirm Booking</button>
    <p id="message"></p>
</div>
<script src="js/booking.js"></script>
</body>
</html>
